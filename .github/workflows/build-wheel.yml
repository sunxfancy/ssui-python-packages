name: Build one wheel

on:
  workflow_call:
    inputs:
      package: {required: true, type: string}
      target: {required: true, type: string}
      fingerprint: {required: true, type: string}
      runner: {required: true, type: string}
      python: {required: true, type: string}
      architecture: {required: true, type: string}
      publish: {required: true, type: boolean}

permissions:
  contents: read

concurrency:
  group: wheel-${{ inputs.package }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python }}
          architecture: ${{ inputs.architecture }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ inputs.architecture }}
      - name: Build and verify pinned source
        id: build
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
          FINGERPRINT: ${{ inputs.fingerprint }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: python scripts/build.py --package "$PACKAGE" --target "$TARGET" --fingerprint "$FINGERPRINT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ inputs.package }}-${{ inputs.target }}
          path: ${{ steps.build.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-${{ inputs.package }}-${{ inputs.target }}
          path: dist/release
      - name: Publish only this successful target
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: python scripts/publish.py --package "$PACKAGE" --target "$TARGET" --fingerprint "$FINGERPRINT" --directory dist/release

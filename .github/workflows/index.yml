name: Refresh package index

on:
  workflow_run:
    workflows: [Build wheels]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run never checks out or executes untrusted PR code/artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build cumulative index from verified releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/index.py --output .work/site
      - name: Update generated gh-pages without overwriting history
        shell: bash
        run: |
          set -euo pipefail
          cd .work/site
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(git -C ../.. config --get http.https://github.com/.extraheader)"
          git config http.https://github.com/.extraheader "$auth"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git reset --soft FETCH_HEAD
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified wheel catalog"
          git push origin HEAD:gh-pages
